<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QR Generator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }
    input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h2>Генератор QR</h2>

<input id="text" placeholder="Введите текст или ссылку" />

<br>

<button onclick="generate()">Создать QR</button>

<br>

<canvas id="qr"></canvas>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  function generate() {
    const text = document.getElementById("text").value;

    if (!text) {
      alert("Введите текст");
      return;
    }

    QRCode.toCanvas(document.getElementById("qr"), text, {
      width: 250
    }, function (error) {
      if (error) console.error(error);
    });
  }
</script>

</body>
</html>
