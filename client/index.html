<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
    }
    button {
      font-size: 20px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
    }
    #result {
      margin-top: 30px;
      font-size: 18px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<h2>Сканер QR / штрихкода</h2>

<button onclick="scan()">Сканировать</button>

<div id="result">Результат появится здесь</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  function scan() {
    tg.showScanQrPopup({
      text: "Наведи камеру на код"
    }, function(result) {
      document.getElementById("result").innerText = result;
      tg.closeScanQrPopup();
    });
  }
</script>

</body>
</html>
